name: Arya Android CI

on:
  push:
    branches: [ "**" ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
          # This repo's gradle/wrapper/gradle-wrapper.jar is a self-contained bootstrap
          # wrapper (see README.md / FIXES_LOG_NEW.md), not the stock Gradle-generated jar,
          # because the original dev environment had no network access to download the real
          # one. gradle/actions' wrapper-validation step checks the wrapper jar's checksum
          # against Gradle's list of official published jars and always fails on a custom
          # jar like this one — disabling it here just skips that specific check; the actual
          # Gradle 8.7 distribution used to run the build is still the real one downloaded by
          # this action via `gradle-version: '8.7'` above.
          validate-wrappers: false

      - name: Unit tests
        working-directory: .
        run: gradle test

      - name: Debug APK
        working-directory: .
        env:
          ARYA_RELAY_URL: ${{ secrets.ARYA_RELAY_URL }}
          ARYA_RELAY_APP_SECRET: ${{ secrets.ARYA_RELAY_APP_SECRET }}
        run: gradle assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: arya-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
