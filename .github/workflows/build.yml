name: Build APK

# Runs on every push to main, plus a manual "Run workflow" button in the Actions tab
# (workflow_dispatch) for re-running without needing a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    # GITHUB_TOKEN defaults to read-only for contents — without this, the "Create GitHub
    # Release" step at the bottom fails with 403 "Resource not accessible by integration"
    # even though the build/upload-artifact steps above it work fine.
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Installs whatever Gradle version app/../gradle/wrapper/gradle-wrapper.properties asks
      # for (currently 8.7) and runs it directly as `gradle ...` below — this project's repo
      # doesn't commit a gradlew/gradlew.bat wrapper script or gradle-wrapper.jar (those are
      # binary/generated files), so this sidesteps needing them entirely rather than requiring
      # they be committed. Also gives free build-cache/dependency-cache between runs.
      # Pinned explicitly (matches gradle/wrapper/gradle-wrapper.properties) rather than
      # gradle-version: wrapper — that auto-detection needs an actual gradlew script to read,
      # and this repo doesn't commit one (see the comment above), so it was silently falling
      # back to the newest Gradle (9.x) instead. Gradle 9 removed an API this project's Kotlin
      # 1.9.24 + kapt still calls (Configuration.fileCollection(Spec)), which hard-failed every
      # kapt task with NoSuchMethodError. 8.7 is what this project's Kotlin/AGP versions expect.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      # Release signing is optional — if this secret isn't set in the repo (Settings ->
      # Secrets and variables -> Actions), this step just skips itself (bash-side check,
      # since GitHub Actions doesn't allow referencing `secrets` directly in a step's `if:`)
      # and app/build.gradle.kts's own fallback (see its signingConfigs comment) produces an
      # unsigned release APK instead of failing the build.
      - name: Decode release keystore
        env:
          ARYA_KEYSTORE_BASE64: ${{ secrets.ARYA_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ARYA_KEYSTORE_BASE64" ]; then
            echo "$ARYA_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ARYA_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "ARYA_KEYSTORE_BASE64 secret not set — building an unsigned release APK."
          fi

      - name: Build release APK
        env:
          ARYA_RELAY_URL: ${{ secrets.ARYA_RELAY_URL }}
          ARYA_RELAY_APP_SECRET: ${{ secrets.ARYA_RELAY_APP_SECRET }}
          ARYA_KEYSTORE_PASSWORD: ${{ secrets.ARYA_KEYSTORE_PASSWORD }}
          ARYA_KEY_ALIAS: ${{ secrets.ARYA_KEY_ALIAS }}
          ARYA_KEY_PASSWORD: ${{ secrets.ARYA_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      # Always uploaded, signed or not — visible under the workflow run's "Summary" tab,
      # Artifacts section, even without creating a GitHub Release.
      - name: Upload APK as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: arya-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error

      # Also publishes a proper GitHub Release (with a permanent download link) each time
      # main gets a new build, tagged by run number so repeated pushes don't collide.
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Arya build ${{ github.run_number }}
          files: app/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
